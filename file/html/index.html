<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sellami menu</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@1.2.3/minified/html5-qrcode.min.js"></script>

</head>
<body   class="body">
    <header class="header">
    <div class="container header__row">
      <div class="brand">Sellami</div>
      <div class="controls">
        <input id="search" class="input search" placeholder="Rechercher... / بحث" />
      </div>
      <button id="openCart" class="btn btn--light">
        🛒 <span id="cartCount" class="badge">0</span>
      </button>
      
    </div>
    <div id="promotionBanner" class="promotion-banner" style="display:none;"></div>
    <div id="categorie">

      </div>
  </header>


<div class="page">
        <h2 id="name" class="cat-title"></h2>
        <div class="grid" style="color: black;" id="product">
</div>
</div>

 <div id="caractereOverlay" class="caractere-overlay" aria-hidden="true"></div>
 <div class="caractere" id="caractereModal" aria-hidden="true">
   <button class="caractere__close" id="caractereClose" type="button" aria-label="Close">×</button>
   <div class="caractere__content">
     <img class="caractere__img" id="caractereImg" alt="" />
     <div class="caractere__options" id="caractereOptions"></div>
   </div>
 </div>

 <div id="cartOverlay" class="cart-overlay" aria-hidden="true"></div>
 <aside id="cartDrawer" class="cart-drawer" aria-hidden="true">
   <div class="cart-header">
     <div class="cart-title">Votre Panier</div>
     <button id="closeCart" class="cart-close" type="button" aria-label="Close">×</button>
   </div>
   <div id="cartItems" class="cart-items"></div>
   <div class="cart-footer">
     <div class="cart-total-row">
       <div>Total</div>
       <div id="cartTotal" class="cart-total">0.00 DT</div>
     </div>
     <button id="demanderBtn" class="btn btn--primary cart-demander" type="button">Demander</button>
   </div>
 </aside>

 <div id="toast" class="toast" aria-hidden="true"></div>

<div id="paymentOverlay" class="modal-overlay" aria-hidden="true"></div>
<div id="paymentModal" class="modal" aria-hidden="true">
  <div class="modal__header">
    <div class="modal__title">Choisir le mode de paiement</div>
    <button id="paymentClose" class="modal__close" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="modal__body">
    <div id="discountBanner" class="discount-banner" style="display:none;"></div>
    <div id="paymentTotal" class="payment-total">
      <span>Total à payer :</span>
      <span id="paymentTotalAmount"></span>
    </div>
    <div class="payment-options">
      <button id="payCard" class="btn payment-btn payment-btn--card">
        <span class="payment-btn__icon">&#128179;</span>
        <span class="payment-btn__label">Paiement par Carte</span>
      </button>
      <button id="payCash" class="btn payment-btn payment-btn--cash">
        <span class="payment-btn__icon">&#128176;</span>
        <span class="payment-btn__label">Paiement en Espèces</span>
      </button>
    </div>
  </div>
</div>

<div id="qrOverlay" class="modal-overlay" aria-hidden="true"></div>
<div id="qrModal" class="modal" aria-hidden="true">
  <div class="modal__header">
    <div class="modal__title">Scanner votre carte</div>
    <button id="qrClose" class="modal__close" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="modal__body">
    <div id="qr-reader"></div>
    <div id="qrManualToggle" class="qr-manual-toggle">Saisir manuellement</div>
    <div id="qrManualSection" class="qr-manual-fallback">
      <input id="qrInput" class="qr-input" type="text" placeholder="Identifiant de la carte..." autocomplete="off" />
      <button id="qrVerifyBtn" class="btn btn--primary qr-verify-btn" type="button">Vérifier</button>
    </div>
    <div id="qrResult" class="qr-result" aria-hidden="true"></div>
    <div id="qrCameraError" class="qr-result error" aria-hidden="true" style="display:none;"></div>
  </div>
</div>

<div id="cashOverlay" class="modal-overlay" aria-hidden="true"></div>
<div id="cashModal" class="modal" aria-hidden="true">
  <div class="modal__header">
    <div class="modal__title">Paiement en Espèces</div>
    <button id="cashOk" class="modal__close" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="modal__body">
    <div class="cash-message">
      <div class="cash-message__icon">&#128176;</div>
      <p>Veuillez vous rendre à la caisse pour effectuer votre paiement.</p>
      <p class="cash-message__thanks">Merci de votre visite !</p>
    </div>
  </div>
</div>

       <script  src="../js/script.js"></script>
</body>
</html>
